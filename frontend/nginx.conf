server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API sang backend — không có URI ở proxy_pass nên giữ nguyên
    # path gốc (VD /api/tours -> backend nhận đúng /api/tours), khớp cách
    # Vite dev proxy hoạt động (xem frontend/vite.config.ts).
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (thông báo + chat real-time) — cần nâng cấp lên WebSocket và
    # timeout dài hơn mặc định vì kết nối giữ lâu (long-lived).
    location /ws/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: mọi route không khớp file tĩnh đều trả về index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
